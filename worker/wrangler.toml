name = "mangadle-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated list of origins allowed to call the API, e.g. "https://yourname.github.io"
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "mangadle"
database_id = "PASTE_DATABASE_ID_FROM_wrangler_d1_create"

# ADMIN_TOKEN is a secret, not a var: npx wrangler secret put ADMIN_TOKEN
